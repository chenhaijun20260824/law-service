﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>详情 - 法律服务</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#F0F4F8;color:#1A202C;min-height:100vh;padding-bottom:80px;}
.header{background:linear-gradient(135deg,#1A365D,#2B6CB0);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.header a{color:#fff;text-decoration:none;font-size:14px;}
.header span{flex:1;text-align:center;font-size:17px;font-weight:bold;}
.content{padding:14px 16px;max-width:700px;margin:0 auto;}
.main-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px;}
.main-img{width:100%;height:240px;object-fit:cover;background:#EBF8FF;display:flex;align-items:center;justify-content:center;font-size:64px;}
.main-img img{width:100%;height:240px;object-fit:cover;}
.main-body{padding:16px;}
.main-name{font-size:20px;font-weight:bold;color:#1A365D;margin-bottom:6px;}
.main-role{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;background:#EBF8FF;color:#2B6CB0;margin-bottom:10px;}
.main-meta{font-size:14px;color:#4A5568;line-height:2;}
.main-meta .label{color:#718096;font-size:12px;}
.photo-gallery{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.photo-gallery img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1.5px solid #E2E8F0;cursor:pointer;}
.info-section{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;}
.info-section h3{font-size:15px;color:#1A365D;margin-bottom:10px;border-left:3px solid #C19A3B;padding-left:8px;}
.info-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0F4F8;font-size:14px;}
.info-row:last-child{border-bottom:none;}
.info-label{color:#718096;min-width:80px;}
.info-value{color:#1A202C;flex:1;}
.case-tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:13px;background:#EBF8FF;color:#2B6CB0;}
.liability-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;background:#FFF5F5;color:#C53030;border:1.5px solid #FEB2B2;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:99999;pointer-events:none;}
.loading{text-align:center;padding:60px;color:#CBD5E0;}
.tel-link{color:#2B6CB0;font-weight:bold;text-decoration:none;font-size:15px;}
.tel-hint{font-size:12px;color:#2B6CB0;}
.call-bar{padding:0 16px 14px;}
.call-bar a{display:block;text-align:center;padding:15px;background:linear-gradient(135deg,#1A365D,#2B6CB0);color:#fff;border-radius:12px;font-size:16px;font-weight:bold;text-decoration:none;box-shadow:0 3px 10px rgba(26,54,93,.28);}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()">← 返回</a>
  <span id="pageTitle">详情</span>
</div>
<div class="content" id="content">
  <div class="loading">加载中…</div>
</div>
<script>
var JB={BINS:{accounts:'accounts',lawyer_assistants:'lawyer_assistants',lawyers:'lawyers',user_needs:'user_needs',notices:'notices',audit_log:'audit_log',accepted_cases:'accepted_cases'},_adapterNow:function(){try{return window.RoseSyncAdapter||null}catch(e){return null}},_storageKey:function(k){return'law_'+k},_unwrap:function(v){var d=0;while(d<5&&v&&typeof v==='object'&&'record' in v&&Object.keys(v).length<=2){v=v.record;d++}return v},_getLocal:function(k){try{var v=localStorage.getItem(this._storageKey(k));return v?this._unwrap(JSON.parse(v)):[]}catch(e){return[]}},_setLocal:function(k,d){try{localStorage.setItem(this._storageKey(k),JSON.stringify(d));return true}catch(e){if(typeof toast==='function')toast('存储满');return false}},_mergeLists:function(la,ca){var ds={};this.getDeleted('').forEach(function(id){ds[id]=true});var map={},nk=[];function ts(it){return(it&&(it.updateTime||it.time||it.registerTime))||0}function ko(it){return it&&(it.id||it.account||it.accountId)}function ad(it){if(!it||typeof it!=='object')return;var k=ko(it);if(k&&ds[k])return;if(!k){nk.push(it);return}if(!map[k])map[k]=[it,ts(it)];else if(ts(it)>map[k][1])map[k]=[it,ts(it)]}(ca||[]).forEach(ad);(la||[]).forEach(ad);var out=[];Object.keys(map).forEach(function(k){out.push(map[k][0])});return out.concat(nk)},get:function(k,cb){var lo=this._getLocal(k),ad=this._adapterNow();if(ad&&typeof ad.pull==='function'){var st=false;var fin=function(ca,ok){if(st)return;st=true;if(ok&&Array.isArray(ca)){var m=this._mergeLists(lo,ca);this._setLocal(k,m);cb(m,true,ca)}else cb(lo,false,lo)}.bind(this);ad.pull(k,fin);setTimeout(function(){fin(lo,false)},2500)}else setTimeout(function(){cb(lo,true,lo)},0)},put:function(k,d,cb){this._setLocal(k,d);var ad=this._adapterNow();if(ad&&typeof ad.push==='function'){var st=false;var fin=function(ok){if(st)return;st=true;if(typeof cb==='function')cb(ok)};ad.push(k,d,fin);setTimeout(function(){fin(false)},2500)}else if(typeof cb==='function')setTimeout(function(){cb(true)},0)},syncAll:function(cb){var ad=this._adapterNow();if(!ad){if(typeof cb==='function')cb(true);return}var self=this,keys=['accounts','lawyer_assistants','lawyers','user_needs','notices','audit_log','accepted_cases'],pend=keys.length;function dn(){pend--;if(pend<=0&&typeof cb==='function')cb(true)}keys.forEach(function(k){var snap=self._getLocal(k);self.get(k,function(m,ok,raw){if(!ok){dn();return}raw=raw||[];var mg=self._mergeLists(snap,raw);if(JSON.stringify(mg)===JSON.stringify(raw))dn();else self.put(k,mg,dn)})})},getCurrentUser:function(){try{var r=localStorage.getItem('law_current_user');return r?JSON.parse(r):null}catch(e){return null}},genId:function(){var ts=Date.now().toString(36);var r1=Math.random().toString(36).slice(2);var r2='';try{r2=crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}catch(e){r2=Math.random().toString(36).slice(2)}return ts+r1+r2},_deletedKey:function(k){return'law_deleted_'+k},getDeleted:function(k){try{return JSON.parse(localStorage.getItem(this._deletedKey(k))||'[]')}catch(e){return[]}},markDeleted:function(k,id){if(!id)return;var d=this.getDeleted(k);if(d.indexOf(id)<0)d.push(id);try{localStorage.setItem(this._deletedKey(k),JSON.stringify(d))}catch(e){}}};
setTimeout(function(){try{JB.syncAll()}catch(e){}},800);
window.onerror=function(m,s,l,c){try{var d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap';d.textContent='报错: '+m+' ('+l+':'+c+')';(document.body||document.documentElement).appendChild(d)}catch(e){}return false};
function toast(msg){var el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},2200)}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function imgErr(img){try{img.onerror=null;img.src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 220'><rect width='280' height='220' fill='%23EBF8FF'/><text x='140' y='130' font-size='40' text-anchor='middle' fill='%232B6CB0'>⚖</text></svg>"}catch(e){}}

var params={};
try{location.search.slice(1).split('&').forEach(function(p){var kv=p.split('=');params[kv[0]]=decodeURIComponent(kv[1]||'')})}catch(e){}
var type=params.type||'user_need';
var id=params.id||'';
var binMap={user_need:'user_needs',lawyer_assistant:'lawyer_assistants',lawyer:'lawyers'};
var bin=binMap[type];
var typeName={user_need:'用户需求',lawyer_assistant:'律师助理',lawyer:'执业律师'}[type]||'详情';
document.getElementById('pageTitle').textContent=typeName+'详情';

function render(item){
  if(!item){document.getElementById('content').innerHTML='<div class="loading">未找到该记录</div>';return}
  var photos='';
  if(item.photos&&item.photos.length>0){
    var mainPhoto='<div class="main-img"><img src="'+esc(item.photos[0])+'" onerror="imgErr(this)" alt=""></div>';
    var gallery='<div class="photo-gallery">';
    for(var i=0;i<item.photos.length;i++)gallery+='<img src="'+esc(item.photos[i])+'" onclick="window.open(\''+esc(item.photos[i])+'\')" onerror="this.style.display=\'none\'">';
    gallery+='</div>';
    photos=mainPhoto+gallery;
  } else {
    var icon={user_need:'📋',lawyer_assistant:'📎',lawyer:'⚖'}[type]||'📋';
    photos='<div class="main-img" style="background:#EBF8FF;">'+icon+'</div>';
  }
  var meta='';
  if(item.phone)meta+='<div class="info-row"><span class="info-label">联系电话</span><span class="info-value"><a class="tel-link" href="tel:'+String(item.phone).replace(/[^0-9+]/g,'')+'">'+esc(item.phone)+'</a> <span class="tel-hint">（点击号码直接拨打）</span></span></div>';
  if(item.firm)meta+='<div class="info-row"><span class="info-label">执业律所</span><span class="info-value">'+esc(item.firm)+'</span></div>';
  if(item.position)meta+='<div class="info-row"><span class="info-label">职位</span><span class="info-value">'+esc(item.position)+'</span></div>';
  if(item.address)meta+='<div class="info-row"><span class="info-label">联系地址</span><span class="info-value">'+esc(item.address)+'</span></div>';
  if(item.hospital)meta+='<div class="info-row"><span class="info-label">就诊医院</span><span class="info-value">'+esc(item.hospital)+'</span></div>';
  if(item.liability)meta+='<div class="info-row"><span class="info-label">责任认定</span><span class="info-value"><span class="liability-tag">'+esc(item.liability)+'</span></span></div>';
  if(item.caseType)meta+='<div class="info-row"><span class="info-label">案件类型</span><span class="info-value"><span class="case-tag">'+esc(item.caseType)+'</span></span></div>';
  if(item.caseDesc)meta+='<div class="info-row" style="display:block;"><span class="info-label" style="display:block;margin-bottom:4px;">案情叙述</span><span class="info-value" style="display:block;white-space:pre-wrap;line-height:1.7;">'+esc(item.caseDesc)+'</span></div>';
  var roleLabel={user_need:'👥 用户需求',lawyer_assistant:'📋 律师助理',lawyer:'⚖️ 执业律师'}[type]||'详情';
  var statusColor={已通过:'#2E7D32',待审核:'#DD6B20',已拒绝:'#C53030'}[item.status]||'#718096';
  var statusBg={已通过:'#F0FFF4',待审核:'#FFFAF0',已拒绝:'#FFF5F5'}[item.status]||'#F7FAFC';
  var callBar=item.phone?'<div class="call-bar"><a href="tel:'+String(item.phone).replace(/[^0-9+]/g,'')+'">&#x1F4DE; 点击拨打 '+esc(item.phone)+'</a></div>':'';document.getElementById('content').innerHTML=
    '<div class="main-card">'+photos+'<div class="main-body">'+
    '<div class="main-name">'+esc(item.name)+'</div>'+
    '<div style="margin-bottom:8px;"><span class="main-role">'+roleLabel+'</span> <span style="padding:2px 8px;border-radius:12px;font-size:12px;background:'+statusBg+';color:'+statusColor+';">'+esc(item.status||'待审核')+'</span></div>'+
    '</div></div>'+callBar+
    '<div class="info-section"><h3>详细信息</h3>'+meta+'</div>';
}
function loadDetail(){JB.get(bin,function(data){var item=(data||[]).find(function(v){return v.id===id});render(item)})}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',loadDetail)}else{loadDetail()}
</script>
<script src="cloud-config.js"></script>
<script src="cloud-api.js"></script>
</body>
</html>
