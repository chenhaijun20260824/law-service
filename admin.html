<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 - 法律服务</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#F0F4F8; color:#1A202C; min-height:100vh; }
.header { background:linear-gradient(135deg,#1A365D,#2B6CB0); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:50; }
.header span { flex:1; text-align:center; font-size:17px; font-weight:bold; }
.header a { color:#fff; text-decoration:none; font-size:13px; }
.login-view { max-width:360px; margin:80px auto; padding:0 20px; }
.login-card { background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 4px 20px rgba(26,54,93,.1); }
.login-card h2 { text-align:center; color:#1A365D; margin-bottom:20px; font-size:18px; }
.login-card input { width:100%; padding:12px 14px; border:1.5px solid #CBD5E0; border-radius:10px; font-size:15px; margin-bottom:12px; box-sizing:border-box; outline:none; }
.login-card input:focus { border-color:#2B6CB0; }
.btn { padding:11px 16px; border:none; border-radius:10px; font-size:14px; font-weight:bold; cursor:pointer; }
.btn-primary { background:linear-gradient(135deg,#1A365D,#2B6CB0); color:#fff; }
.btn-primary:active { transform:scale(.98); }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
.btn-pass { background:#2E7D32; color:#fff; }
.btn-reject { background:#C53030; color:#fff; }
.btn-del { background:#718096; color:#fff; }
.btn-ghost { background:#fff; color:#1A365D; border:1.5px solid #1A365D; }
.tabs { display:flex; gap:6px; padding:10px 16px; background:#fff; border-bottom:1px solid #E2E8F0; flex-wrap:wrap; }
.tab { flex:1; min-width:70px; text-align:center; padding:9px 6px; border-radius:10px; background:#F7FAFC; cursor:pointer; font-size:12px; border:1.5px solid #E2E8F0; color:#718096; }
.tab.active { background:#1A365D; color:#fff; border-color:#1A365D; }
.panel { display:none; padding:12px 16px; max-width:700px; margin:0 auto; }
.panel.active { display:block; }
.list-card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.05); border-left:3px solid #CBD5E0; }
.list-card.pending { border-left-color:#DD6B20; }
.list-card.approved { border-left-color:#2E7D32; }
.list-card.rejected { border-left-color:#C53030; }
.list-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.list-card-name { font-weight:bold; font-size:15px; color:#1A365D; }
.list-card-status { padding:2px 8px; border-radius:12px; font-size:11px; font-weight:bold; }
.status-pending { background:#FFFAF0; color:#DD6B20; }
.status-approved { background:#F0FFF4; color:#2E7D32; }
.status-rejected { background:#FFF5F5; color:#C53030; }
.list-card-meta { font-size:13px; color:#718096; line-height:1.8; }
.list-card-photos { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.list-card-photos img { width:52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid #E2E8F0; }
.list-card-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.form-area { background:#fff; border-radius:12px; padding:16px; margin:12px 16px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.form-area h3 { font-size:15px; color:#1A365D; margin-bottom:12px; border-bottom:2px solid #C19A3B; padding-bottom:8px; }
.form-area input,.form-area textarea { width:100%; padding:10px 12px; border:1.5px solid #CBD5E0; border-radius:8px; font-size:14px; box-sizing:border-box; outline:none; margin-bottom:10px; }
.form-area textarea { resize:vertical; min-height:80px; }
.form-area input:focus,.form-area textarea:focus { border-color:#2B6CB0; }
.empty { text-align:center; color:#CBD5E0; padding:40px; font-size:13px; }
.cloud-bar { background:#fff; padding:8px 16px; display:flex; align-items:center; gap:8px; font-size:13px; border-bottom:1px solid #E2E8F0; }
.cloud-bar .btn { padding:5px 10px; font-size:12px; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 24px; border-radius:10px; font-size:14px; z-index:99999; pointer-events:none; }
.sort-info { font-size:12px; color:#A0AEC0; margin-bottom:8px; }
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← 首页</a>
  <span>🔧 管理后台</span>
</div>

<div id="loginView">
  <div class="login-view">
    <div class="login-card">
      <h2>🔐 管理员登录</h2>
      <input id="adminPwd" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn btn-primary" style="width:100%;padding:13px;" onclick="adminLogin()">登 录</button>
      <div id="loginErr" style="color:#C53030;font-size:13px;margin-top:10px;text-align:center;display:none;"></div>
    </div>
  </div>
</div>

<div id="adminView" style="display:none;">
  <div class="cloud-bar">
    <span style="flex:1;color:#718096;">☁️ 云端状态：<b id="cloudStatusText">检测中…</b></span>
    <button class="btn btn-sm btn-primary" onclick="adminSyncNow()" style="background:#2B6CB0;color:#fff;">同步</button>
    <button class="btn btn-sm btn-ghost" onclick="toggleAdminCloudInput()">☁️ 连接</button>
  </div>
  <div id="adminCloudInput" style="display:none;background:#EBF8FF;padding:10px 16px;border-bottom:1px solid #CBD5E0;">
    <input id="adminTokenInput" placeholder="粘贴 GitHub Token (ghp_...)" style="flex:1;padding:8px 12px;border:1.5px solid #CBD5E0;border-radius:8px;font-size:13px;margin-right:8px;" onkeydown="if(event.key==='Enter')saveAdminCloud()">
    <button class="btn btn-sm btn-primary" onclick="saveAdminCloud()">保存</button>
    <div id="adminCloudMsg" style="font-size:12px;margin-top:6px;color:#718096;"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('need',this)">👥 用户需求</div>
    <div class="tab" onclick="switchTab('assist',this)">📋 律师助理</div>
    <div class="tab" onclick="switchTab('lawyer',this)">⚖️ 执业律师</div>
    <div class="tab" onclick="switchTab('notice',this)">📢 公告</div>
  </div>

  <div id="needPanel" class="panel active">
    <div class="sort-info">按时间倒序 · 待审核排在最前</div>
    <div id="needList"></div>
  </div>
  <div id="assistPanel" class="panel">
    <div class="sort-info">按时间倒序 · 待审核排在最前</div>
    <div id="assistList"></div>
  </div>
  <div id="lawyerPanel" class="panel">
    <div class="sort-info">按时间倒序 · 待审核排在最前</div>
    <div id="lawyerList"></div>
  </div>
  <div id="noticePanel" class="panel">
    <div class="form-area">
      <h3>📢 发布公告</h3>
      <input id="noticeTitle" placeholder="公告标题">
      <textarea id="noticeContent" placeholder="公告内容"></textarea>
      <button class="btn btn-primary" onclick="publishNotice()">发布公告</button>
    </div>
    <div class="sort-info">已发布公告（按时间倒序）</div>
    <div id="noticeList"></div>
  </div>
</div>
<script>
var JB={BINS:{accounts:'accounts',lawyer_assistants:'lawyer_assistants',lawyers:'lawyers',user_needs:'user_needs',notices:'notices',audit_log:'audit_log',accepted_cases:'accepted_cases'}};JB.get=function(key,cb){var lo=null;try{var v=localStorage.getItem('law_'+key);lo=v?JSON.parse(v):null}catch(e){lo=null}var done=false;var fin=function(d){if(done)return;done=true;cb(Array.isArray(d)?d:(d||null))};var adapter=window.RoseSyncAdapter||null;if(adapter&&typeof adapter.pull==='function'){adapter.pull(key,function(cloudData,cloudOk){if(done)return;done=true;if(cloudOk&&Array.isArray(cloudData)){try{localStorage.setItem('law_'+key,JSON.stringify(cloudData))}catch(e){}cb(cloudData)}else cb(lo)})}else{fin(lo)}setTimeout(function(){fin(lo)},3000)};JB.put=function(key,val,cb){try{localStorage.setItem('law_'+key,JSON.stringify(val))}catch(e){}var done=false;var fin=function(ok){if(done)return;done=true;if(cb)cb(ok)};var adapter=window.RoseSyncAdapter||null;if(adapter&&typeof adapter.push==='function'){adapter.push(key,val,fin)}else{fin(true)}setTimeout(function(){fin(false)},3000)};JB.syncAll=function(){};function adminSyncNow(){var st=document.getElementById('cloudStatusText');var ad=window.RoseSyncAdapter||null;if(!ad||typeof ad.pull!=='function'){alert('未配置云端连接。请先打开 cloud-setup.html 配置 GitHub Token（与提交方相同），再回到本页点「同步」');return}st.textContent='同步中…';var keys=['user_needs','lawyer_assistants','lawyers','notices'];var left=keys.length;keys.forEach(function(k){JB.get(k,function(){left--;if(left<=0){st.textContent='已同步';loadAll();setTimeout(function(){st.textContent='已连接'},1600)}})})}setTimeout(function(){try{JB.syncAll()}catch(e){}},800);window.onerror=function(m,s,l,c){try{var d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap';d.textContent='Error: '+m+' ('+l+':'+c+')';document.body.appendChild(d)}catch(e){}return false};function toast(msg){var el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.style.opacity='0'},2000)};function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};var _logged=false;try{_logged=localStorage.getItem('law_admin_logged')==='1'}catch(e){_logged=false}if(_logged){document.getElementById('loginView').style.display='none';document.getElementById('adminView').style.display='block';}function adminLogin(){var p=document.getElementById('adminPwd').value;if(p==='admin'){try{localStorage.setItem('law_admin_logged','1')}catch(e){}document.getElementById('loginView').style.display='none';document.getElementById('adminView').style.display='block';alert((function(){try{return 'user_needs:'+(localStorage.getItem('law_user_needs')||'空')+'\nlawyer_assistants:'+(localStorage.getItem('law_lawyer_assistants')||'空')+'\nlawyers:'+(localStorage.getItem('law_lawyers')||'空')}catch(e){return '⚠ 当前页面运行在沙箱环境(禁用了localStorage)，无法读取本地数据。请用浏览器直接打开或通过 server.bat 访问 localhost:5000'}})());loadAll()}else{var e=document.getElementById('loginErr');e.textContent='密码错误';e.style.display='block'}}var _needData=[],_assistData=[],_lawyerData=[],_noticeData=[];var _binKeys={need:'user_needs',assist:'lawyer_assistants',lawyer:'lawyers'};function loadAll(){console.log('=== admin loadAll ===');try{console.log('user_needs:',localStorage.getItem('law_user_needs'));console.log('lawyer_assistants:',localStorage.getItem('law_lawyer_assistants'));console.log('lawyers:',localStorage.getItem('law_lawyers'))}catch(e){console.log('localStorage unavailable:',e.message)}JB.get('user_needs',function(d){_needData=d||[];renderNeed()});JB.get('lawyer_assistants',function(d){_assistData=d||[];renderAssist()});JB.get('lawyers',function(d){_lawyerData=d||[];renderLawyer()});JB.get('notices',function(d){_noticeData=d||[];renderNoticeList()})}function switchTab(tab,el){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});el.classList.add('active');document.getElementById(tab+'Panel').classList.add('active')}function sortByTime(arr){return(arr||[]).slice().sort(function(a,b){if(a.status==='待审核'&&b.status!=='待审核')return-1;if(a.status!=='待审核'&&b.status==='待审核')return 1;return(b.registerTime||0)-(a.registerTime||0)})}function renderItem(item,role){var photos='';if(item.photos&&item.photos.length>0){photos='<div class="list-card-photos">';for(var i=0;i<item.photos.length;i++){var src=esc(item.photos[i]);photos+='<img src="'+src+'" />'}photos+='</div>'}var meta='';if(item.phone)meta+='&#x1F4DE; '+esc(item.phone)+'<br>';if(item.address)meta+='&#x1F4CD; '+esc(item.address)+'<br>';if(item.firm)meta+='&#x1F3E2; '+esc(item.firm)+'<br>';if(item.caseType)meta+='&#x1F4CB; 案件类型：'+esc(item.caseType)+'<br>';if(item.caseDesc)meta+='&#x1F4DD; '+esc(item.caseDesc).substring(0,60)+(item.caseDesc.length>60?'...':'');var date=item.registerTime?new Date(item.registerTime).toLocaleString():'';var statusCls={待审核:'pending',已通过:'approved',已拒绝:'rejected'}[item.status]||'pending';var rid=esc(item.id);var r2=role;var approved='&#x2713; 通过',reject='&#x2717; 拒绝',del='&#x1F5D1; 删除';var actBtns='';if(item.status==='待审核'){actBtns='<button class="btn btn-sm btn-pass" onclick="doAudit(&quot;'+rid+'&quot;,&quot;'+r2+'&quot;,&quot;approved&quot;)">'+approved+'</button><button class="btn btn-sm btn-reject" onclick="doAudit(&quot;'+rid+'&quot;,&quot;'+r2+'&quot;,&quot;rejected&quot;)">'+reject+'</button>'}else{actBtns='<button class="btn btn-sm btn-del" onclick="delItem(&quot;'+rid+'&quot;,&quot;'+r2+'")">'+del+'</button>'}return'<div class="list-card '+statusCls+'"><div class="list-card-header"><span class="list-card-name">'+esc(item.name)+'</span><span class="list-card-status status-'+statusCls+'">'+esc(item.status||'待审核')+'</span></div><div class="list-card-meta">'+meta+'<br><span style="color:#A0AEC0">'+date+'</span></div>'+photos+'<div class="list-card-actions">'+actBtns+'</div></div>'}function renderNeed(){var box=document.getElementById('needList');var arr=sortByTime(_needData);box.innerHTML=arr.length?arr.map(function(v){return renderItem(v,'need')}).join(''):'<div class="empty">暂无用户需求</div>'}function renderAssist(){var box=document.getElementById('assistList');var arr=sortByTime(_assistData);box.innerHTML=arr.length?arr.map(function(v){return renderItem(v,'assist')}).join(''):'<div class="empty">暂无律师助理</div>'}function renderLawyer(){var box=document.getElementById('lawyerList');var arr=sortByTime(_lawyerData);box.innerHTML=arr.length?arr.map(function(v){return renderItem(v,'lawyer')}).join(''):'<div class="empty">暂无执业律师</div>'}function doAudit(id,role,action){var binKey=_binKeys[role];var data=role==='need'?_needData:(role==='assist'?_assistData:_lawyerData);var item=data.find(function(v){return v.id===id});if(!item)return;var newStatus=action==='approved'?'已通过':'已拒绝';item.status=newStatus;item.updateTime=Date.now();item.auditTime=Date.now();JB.put(binKey,data);if(role==='need')renderNeed();else if(role==='assist')renderAssist();else renderLawyer()}function delItem(id,role){var binKey=_binKeys[role];var data=role==='need'?_needData:(role==='assist'?_assistData:_lawyerData);if(!confirm('确定删除？'))return;var idx=data.findIndex(function(v){return v.id===id});if(idx<0)return;data.splice(idx,1);JB.put(binKey,data);if(role==='need'){_needData=data;renderNeed()}else if(role==='assist'){_assistData=data;renderAssist()}else{_lawyerData=data;renderLawyer()}}function renderNoticeList(){var box=document.getElementById('noticeList');box.innerHTML=_noticeData.length?_noticeData.map(function(n){return'<div class="list-card"><div class="list-card-header"><span class="list-card-name">'+esc(n.title)+'</span></div><div class="list-card-meta">'+esc(n.content).substring(0,100)+(n.content.length>100?'...':'')+'<br><span style="color:#A0AEC0">'+(n.time?new Date(n.time).toLocaleString():'')+'</span></div><div class="list-card-actions"><button class="btn btn-sm btn-del" onclick="delNotice(\'\"\'+esc(n.id)+\'\"\')">&#x1F5D1; 删除</button></div></div>'}).join(''):'<div class="empty">暂无公告</div>'}function publishNotice(){var t=document.getElementById('noticeTitle').value.trim();var c=document.getElementById('noticeContent').value.trim();if(!t||!c){toast('标题和内容不能为空');return}var n={id:'n_'+Date.now(),title:t,content:c,time:Date.now()};_noticeData.unshift(n);JB.put('notices',_noticeData);renderNoticeList();document.getElementById('noticeTitle').value='';document.getElementById('noticeContent').value='';toast('公告发布成功')}function delNotice(id){if(!confirm('确定删除公告？'))return;var idx=_noticeData.findIndex(function(v){return v.id===id});if(idx<0)return;_noticeData.splice(idx,1);JB.put('notices',_noticeData);renderNoticeList()}function toggleAdminCloudInput(){var box=document.getElementById('adminCloudInput');if(box)box.style.display=box.style.display==='none'?'block':'none'}function saveAdminCloud(){var t=document.getElementById('adminTokenInput').value.trim();if(!t){toast('Token不能为空');return}try{localStorage.setItem('law_cloud_cfg',JSON.stringify({token:t,owner:'chenhaijun20260824',repo:'law-service-data',branch:'main',path:'data'}));toast('云端已连接');location.reload()}catch(e){toast('保存失败')}}function checkCloudStatus(){var el=document.getElementById('cloudStatusText');try{var c=JSON.parse(localStorage.getItem('law_cloud_cfg')||'null');if(c&&c.token){el.textContent='☁️ 已连云端';el.style.color='green'}else{el.textContent='☁️ 未连接';el.style.color='gray'}}catch(e){el.textContent='☁️ 未连接';el.style.color='gray'}}
</script>


<script src="cloud-config.js"></script>
<script src="cloud-api.js"></script>
</body>
</html>
